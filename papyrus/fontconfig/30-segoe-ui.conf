<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
SPDX-FileCopyrightText: Copyright DB InfraGO AG and contributors
SPDX-License-Identifier: Apache-2.0

Papyrus' base.css sets "Segoe UI" as the font of every diagram element.
Segoe UI cannot be redistributed; Selawik is Microsoft's open, metric
compatible replacement. Without this alias fontconfig falls back to the
much wider DejaVu Sans and diagrams lay out differently than on Windows.
-->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept>
      <family>Selawik</family>
    </accept>
  </alias>
</fontconfig>
